[general]
todo_file = "todo.md" # Can be absolute or relative path
file_indent = 4       # Number of spaces per indent in todo.md
display_indent = 2    # Number of spaces per indent to render in the app
autosave = false      # Save changes immediately when any change is made (slower)

[colors] # Ayu Dark defaults; named colors, palette indices ("0"-"255"), or "#RRGGBB"
text = "#BFBDB6"
background = "#0B0E14"
completed = "#565B66"
overdue = "#F07178"
upcoming = "#FFB454"
muted = "#6C7380"
actionable = "#AAD94C"
selection_bg = "#242C3A"
descendant_bg = "#131721"
search_fg = "#FFFFFF"
search_bg = "#6C5980"
active_tab_fg = "#0B0E14"
active_tab_bg = "#E6B450"
inactive_tab = "#565B66"
calendar_selection_bg = "#242C3A"

[normal_keymap]
"Ctrl+d" = "Quit"
"Ctrl+c" = "Quit"
"q" = "Quit"
"x" = "Toggle"
"Space" = "Toggle"
"/" = "SearchForward"
"?" = "SearchBackward"
# Line-based navigation (Shift for tree-based)
"k" = "SelectionUp"
"j" = "SelectionDown"
"Up" = "SelectionUp"
"Down" = "SelectionDown"
"K" = "SelectionPrev"
"J" = "SelectionNext"
"Shift+Up" = "SelectionPrev"
"Shift+Down" = "SelectionNext"
"h" = "TabPrev"
"l" = "TabNext"
"Left" = "TabPrev"
"Right" = "TabNext"
"H" = "SelectionOut"
"L" = "SelectionIn"
"Shift+Left" = "SelectionOut"
"Shift+Right" = "SelectionIn"

todo_file = "todo.md" # Can be absolute or relative path
file_indent = 4       # Number of spaces per indent in todo.md
display_indent = 2     # Number of spaces per indent to render in the app

[normal_keymap]
"Ctrl+d" = "Quit"
"Ctrl+c" = "Quit"
"q" = "Quit"
"/" = "SearchForward"
"?" = "SearchBackward"
"x" = "Toggle"
"Space" = "Toggle"
#"k" = "SelectionUp"
#"j" = "SelectionDown"
#"K" = "SelectionPrev"
#"J" = "SelectionNext"
"k" = "SelectionPrev"
"j" = "SelectionNext"
"Up" = "SelectionPrev"
"Down" = "SelectionNext"
"H" = "TabPrev"
"L" = "TabNext"
"Shift+Left" = "TabPrev"
"Shift+Right" = "TabNext"
"r" = "TabRename"
"t" = "TabAdd"
"h" = "SelectionOut"
"l" = "SelectionIn"
"Left" = "SelectionOut"
"Right" = "SelectionIn"
"Enter" = "SelectionIn"
#"Ctrl+k" = "MoveUp"
#"Ctrl+j" = "MoveDown"
#"Ctrl+K" = "MovePrev"
#"Ctrl+J" = "MoveNext"
"Ctrl+k" = "MovePrev"
"Ctrl+j" = "MoveNext"
"Ctrl+Up" = "MovePrev"
"Ctrl+Down" = "MoveNext"
"Ctrl+h" = "MoveOut"
"Ctrl+Left" = "MoveOut"
"<" = "MoveOut"
"Shift+Tab" = "MoveOut"
"Ctrl+l" = "MoveIn"
"Ctrl+Right" = "MoveIn"
">" = "MoveIn"
"Tab" = "MoveIn"
"d" = "Delete"
"y" = "Copy"
"p" = "PasteBelow"
"P" = "PasteAbove"
"n" = "AddTop"
"O" = "AddAbove"
"o" = "AddBelow"
"s" = "AddSubtask"
#"e" = "Edit"
"a" = "Edit"
"A" = "Edit"
"i" = "EditBeginning"
"I" = "EditBeginning"
"c" = "EditClear"
"C" = "EditClear"
"b" = "SetStartDate"
"(" = "SetStartDate"
"[" = "SetStartDate"
"e" = "SetDueDate"
")" = "SetDueDate"
"]" = "SetDueDate"
"u" = "Undo"
"U" = "Redo"
"Ctrl+r" = "Redo"

[text_keymap]
"Ctrl+d" = "Quit"
"Ctrl+c" = "Cancel"
"Enter" = "AddBelow"
"Esc" = "EditDone"
"Tab" = "MoveIn"
"Shift+Tab" = "MoveOut"

[date_picker_keymap]
"Ctrl+d" = "Quit"
"Esc" = "DatePickerCancel"
"Ctrl+c" = "DatePickerCancel"
"q" = "DatePickerCancel"
"Enter" = "DatePickerConfirm"
"H" = "DatePickerPrevMonth"
"<" = "DatePickerPrevMonth"
"L" = "DatePickerNextMonth"
">" = "DatePickerNextMonth"
"k" = "DatePickerDayUp"
"j" = "DatePickerDayDown"
"h" = "DatePickerDayLeft"
"l" = "DatePickerDayRight"
"Up" = "DatePickerDayUp"
"Down" = "DatePickerDayDown"
"Left" = "DatePickerDayLeft"
"Right" = "DatePickerDayRight"
"d" = "DatePickerClear"
